
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rolliude_play
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./Rolliude-backend
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/rolliude_play?schema=public
      - CORS_ORIGIN=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=kafka:29092
      - JWT_SECRET=${JWT_SECRET:-troque-por-um-segredo-local-com-32-caracteres-ou-mais}
      - JWT_EXPIRES_IN_SECONDS=604800
      - ADMIN_NOME=Administrador Rolliúde
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@rolliude.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-troque-esta-senha-admin}
    depends_on:
      - postgres
      - kafka

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rolliude-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  frontend:
    build:
      context: ./Rolliude-front
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:3333/api
    volumes:
      - ./Rolliude-front:/app
      - /app/node_modules

volumes:
  pgdata:
