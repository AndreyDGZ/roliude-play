version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rolliude_play
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./Rolliude-backend
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/rolliude_play?schema=public
      - CORS_ORIGIN=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - postgres

  frontend:
    build:
      context: ./rolliude-play---o-cinema-da-nossa-terra-na-sua-tela
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:3333/api
    volumes:
      - ./rolliude-play---o-cinema-da-nossa-terra-na-sua-tela:/app
      - /app/node_modules

volumes:
  pgdata:
