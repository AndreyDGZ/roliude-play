name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: Rolliude-front/yarn.lock

      - name: Install dependencies
        working-directory: ./Rolliude-front
        run: yarn install --frozen-lockfile

      - name: Format check
        working-directory: ./Rolliude-front
        run: yarn format:check

      - name: Type check
        working-directory: ./Rolliude-front
        run: yarn typecheck

      - name: Build
        working-directory: ./Rolliude-front
        run: yarn build

  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: Rolliude-backend/yarn.lock

      - name: Install dependencies
        working-directory: ./Rolliude-backend
        run: yarn install --frozen-lockfile

      - name: Format check
        working-directory: ./Rolliude-backend
        run: yarn format:check

      - name: Type check
        working-directory: ./Rolliude-backend
        run: yarn typecheck

      - name: Prisma validate
        working-directory: ./Rolliude-backend
        run: yarn prisma:validate

      - name: Build
        working-directory: ./Rolliude-backend
        run: yarn build
