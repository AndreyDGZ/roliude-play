<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolliúde Play - Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f1e6;
    --cream-2: #f2eadb;
    --paper: #ffffff;
    --ink: #241d16;
    --ink-soft: #6f6659;
    --clay: #c2452b;
    --clay-dark: #a23a24;
    --amber: #e8912b;
    --amber-dark: #cf7c1f;
    --line: #e7ddc9;
    --focus: #b5541f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Nunito Sans', system-ui, sans-serif;
    min-height: 100vh;
    color-scheme: light;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--cream-2), var(--cream));
    display: flex;
    justify-content: center;
  }

  .brand {
    max-width: 1040px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand img {
    height: 84px;
    width: auto;
    display: block;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 20px 72px;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  .kicker {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--amber-dark);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Rye', serif;
    font-weight: 400;
    font-size: 2.6rem;
    line-height: 1.12;
    margin: 0 0 12px;
  }

  .tagline {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 1.02rem;
    margin: 0 0 34px;
  }

  .card {
    background: var(--paper);
    border-radius: 18px;
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px -22px rgba(36, 29, 22, 0.35);
    padding: 40px 36px 34px;
    text-align: left;
  }

  .card h2 {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 8px;
  }

  .card p.sub {
    color: var(--ink-soft);
    font-size: 0.96rem;
    line-height: 1.5;
    margin: 0 0 28px;
  }

  form { margin: 0; }

  .field { margin-bottom: 20px; }

  .field-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  label {
    font-weight: 700;
    font-size: 0.92rem;
  }

  .field a {
    font-size: 0.85rem;
    color: var(--clay);
    text-decoration: none;
  }
  .field a:hover { text-decoration: underline; }

  .input-shell {
    position: relative;
  }

  input[type="email"],
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 13px 44px 13px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--cream) !important;
    color: var(--ink) !important;
    font-size: 0.98rem;
    font-family: inherit;
    outline: none;
    color-scheme: light;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder { color: #a89d8b; }

  input:focus {
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(181, 84, 31, 0.16);
  }

  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--ink);
    box-shadow: 0 0 0 1000px var(--cream) inset;
    transition: background-color 9999s ease-in-out 0s;
  }

  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear {
    display: none;
  }

  .toggle-pass {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 8px;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .toggle-pass svg {
    width: 19px;
    height: 19px;
    display: block;
  }
  .toggle-pass:hover {
    color: var(--clay);
    background: var(--cream-2);
  }
  .toggle-pass:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 26px;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  .remember input {
    width: 16px;
    height: 16px;
    accent-color: var(--clay);
  }

  button.primary {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--amber), var(--amber-dark));
    color: #241a08;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  button.primary:hover { filter: brightness(1.04); }
  button.primary:active { transform: translateY(1px); }
  button.primary:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 26px 0;
    color: var(--ink-soft);
    font-size: 0.82rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .footer-line {
    text-align: center;
    font-size: 0.92rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .footer-line a {
    color: var(--clay);
    font-weight: 700;
    text-decoration: none;
  }
  .footer-line a:hover { text-decoration: underline; }

  .status {
    display: none;
    margin: 0 0 20px;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(194, 69, 43, 0.1);
    border: 1px solid rgba(194, 69, 43, 0.3);
    color: var(--clay-dark);
    font-size: 0.88rem;
  }
  .status.show { display: block; }

  footer.site {
    text-align: center;
    padding: 22px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 480px) {
    h1 { font-size: 2.1rem; }
    .card { padding: 30px 22px 26px; }
    .brand img { height: 60px; }
  }
</style>
</head>

<main>
  <div class="wrap">
    <p class="kicker">SUA CONTA</p>
    <h1>Bem-vindo de volta</h1>
    <p class="tagline">O cinema da nossa terra na sua tela.</p>

    <div class="card">
      <h2>Entrar</h2>
      <p class="sub">Informe seus dados para continuar assistindo de onde parou.</p>

      <div class="status" id="statusBox"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <div class="field-head">
            <label for="email">E-mail</label>
          </div>
          <div class="input-shell">
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="password">Senha</label>
            <a href="#" id="forgotLink">Esqueceu a senha?</a>
          </div>
          <div class="input-shell">
            <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <label class="remember">
          <input type="checkbox" id="remember" name="remember">
          Manter conectado neste dispositivo
        </label>

        <button type="submit" class="primary">Entrar</button>
      </form>

      <div class="divider">ou</div>

      <p class="footer-line">Ainda não tem conta? <a href="#">Criar conta gratuita</a></p>
    </div>
  </div>
</main>

<footer class="site">© 2026 Rolliúde Play — Todos os direitos reservados.</footer>

<script>
  const form = document.getElementById('loginForm');
  const statusBox = document.getElementById('statusBox');
  const toggleBtn = document.getElementById('togglePass');
  const passInput = document.getElementById('password');

  const eyeIcon = document.getElementById('eyeIcon');

  const eyeOpenPath = '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle>';
  const eyeOffPath = '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path>';

  toggleBtn.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    const cursorPos = passInput.selectionStart;
    passInput.type = isPass ? 'text' : 'password';
    eyeIcon.innerHTML = isPass ? eyeOffPath : eyeOpenPath;
    toggleBtn.setAttribute('aria-label', isPass ? 'Ocultar senha' : 'Mostrar senha');
    passInput.focus();
    if (cursorPos !== null) passInput.setSelectionRange(cursorPos, cursorPos);
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = passInput.value;
    statusBox.classList.remove('show');

    if (!email || !pass) {
      statusBox.textContent = 'Preencha e-mail e senha para continuar.';
      statusBox.classList.add('show');
      return;
    }
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!emailOk) {
      statusBox.textContent = 'Digite um e-mail válido.';
      statusBox.classList.add('show');
      return;
    }

    statusBox.style.background = 'rgba(232,145,43,0.14)';
    statusBox.style.borderColor = 'rgba(232,145,43,0.4)';
    statusBox.style.color = '#8a5a12';
    statusBox.textContent = 'Entrando... (demonstração — sem backend conectado)';
    statusBox.classList.add('show');
  });

  document.getElementById('forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    statusBox.style.background = 'rgba(194,69,43,0.1)';
    statusBox.style.borderColor = 'rgba(194,69,43,0.3)';
    statusBox.style.color = '#a23a24';
    statusBox.textContent = 'Esta demonstração não inclui a tela de recuperação de senha.';
    statusBox.classList.add('show');
  });
</script>

</body>
</html>
